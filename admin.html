<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>✈️ PCS Swap — Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#222;padding:16px;font-size:14px}
h1{font-size:20px;font-weight:800;color:#1a73e8;margin-bottom:2px}
.sub{font-size:12px;color:#888;margin-bottom:16px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:14px;font-weight:700;color:#333;margin-bottom:10px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #ddd;font-size:13px;background:#fff;margin-bottom:8px;-webkit-appearance:none;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#1a73e8}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;margin-bottom:8px;font-family:inherit}
.btn-primary{background:#1a73e8;color:#fff}
.btn-success{background:#4a8c1c;color:#fff}
.btn-danger{background:#d94040;color:#fff}
.btn-ghost{background:transparent;border:1.5px solid #1a73e8;color:#1a73e8}
.generated-box{background:#f5f7ff;border:1.5px solid #1a73e8;border-radius:10px;padding:12px;margin-top:8px;display:none}
.generated-url{font-size:11px;font-family:monospace;color:#1558b0;word-break:break-all;margin-bottom:10px;padding:8px;background:#fff;border-radius:8px;border:1px solid #ddd;user-select:all}
.token-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.token-row:last-child{border-bottom:none}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.badge-unused{background:#eef7e6;color:#2a5c08;border:1px solid #4a8c1c}
.badge-used{background:#fdf0f0;color:#7a1010;border:1px solid #d94040}
.badge-expired{background:#f5f5f5;color:#888;border:1px solid #ccc}
.login-wrap{max-width:380px;margin:40px auto}
.error{color:#d94040;font-size:12px;margin-top:4px;display:none;padding:6px 10px;background:#fdf0f0;border-radius:8px}
.icon-btn{padding:7px 12px;border-radius:8px;border:1.5px solid #ddd;background:#f5f5f5;color:#555;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:36px;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.icon-btn:hover{background:#e8f0fe;border-color:#1a73e8;color:#1a73e8}
.icon-btn.danger{border-color:#d94040;background:#fdf0f0;color:#d94040}
.icon-btn.danger:hover{background:#d94040;color:#fff}
.token-info{flex:1;min-width:0}
.token-name{font-size:13px;font-weight:700;color:#333}
.token-meta{font-size:10px;color:#aaa;margin-top:2px}
.token-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.copy-feedback{font-size:11px;color:#4a8c1c;display:none;margin-top:4px}
.divider{height:1px;background:#f0f0f0;margin:8px 0}
.stat-row{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#f5f7ff;border-radius:10px;padding:10px;text-align:center}
.stat-n{font-size:20px;font-weight:800;color:#1a73e8}
.stat-l{font-size:10px;color:#888;font-weight:600;text-transform:uppercase}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <h1>✈️ PCS Swap</h1>
  <p class="sub" style="margin-bottom:20px">Admin Panel</p>
  <div class="card">
    <h2>Sign In</h2>
    <input type="email" id="login-email" placeholder="Email address" autocomplete="email">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <p class="error" id="login-error">Invalid email or password.</p>
    <button class="btn btn-primary" onclick="doLogin()" style="margin-top:4px">Sign In</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel" style="display:none;max-width:600px;margin:0 auto">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
    <h1>✈️ PCS Swap</h1>
    <button class="icon-btn" onclick="doSignOut()">Sign Out</button>
  </div>
  <p class="sub" id="admin-email-sub"></p>

  <!-- STATS -->
  <div class="stat-row">
    <div class="stat"><div class="stat-n" id="stat-active">—</div><div class="stat-l">Active</div></div>
    <div class="stat"><div class="stat-n" id="stat-used">—</div><div class="stat-l">Used</div></div>
    <div class="stat"><div class="stat-n" id="stat-devices">—</div><div class="stat-l">Devices</div></div>
  </div>

  <!-- GENERATE TOKEN -->
  <div class="card">
    <h2>Generate Install Link</h2>
    <input type="text" id="recipient-name" placeholder="Recipient name (e.g. John Smith)">
    <select id="token-expiry">
      <option value="24" selected>Expires in 24 hours</option>
      <option value="48">Expires in 48 hours</option>
      <option value="72">Expires in 72 hours</option>
      <option value="168">Expires in 7 days</option>
    </select>
    <select id="token-max-installs">
      <option value="1" selected>1 install (single device)</option>
      <option value="2">2 installs (e.g. iPhone + laptop)</option>
      <option value="3">3 installs</option>
    </select>
    <button class="btn btn-success" onclick="generateToken()">＋ Generate Link</button>
    <div class="generated-box" id="generated-box">
      <div style="font-size:12px;font-weight:700;color:#2a5c08;margin-bottom:6px">✅ Link generated for <span id="gen-name-label"></span></div>
      <div class="generated-url" id="generated-url"></div>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" onclick="copyGenerated()" style="flex:1;justify-content:center" id="copy-gen-btn">📋 Copy Link</button>
        <button class="icon-btn" onclick="document.getElementById('generated-box').style.display='none'" style="flex:1;justify-content:center">✕ Dismiss</button>
      </div>
    </div>
  </div>

  <!-- TOKEN LIST -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="margin-bottom:0">Access Tokens</h2>
      <button class="icon-btn" onclick="loadTokens()">↻ Refresh</button>
    </div>
    <div id="token-list"><p style="font-size:12px;color:#aaa">Loading...</p></div>
  </div>

  <!-- DEVICES -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="margin-bottom:0">Installed Devices</h2>
      <button class="icon-btn" onclick="loadDevices()">↻ Refresh</button>
    </div>
    <div id="device-list"><p style="font-size:12px;color:#aaa">Loading...</p></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc, serverTimestamp, query, orderBy, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyC1yqbVvvqP76RZ4qNXmap2pbR0AfxwPF8",
  authDomain: "pcs-swap-tool.firebaseapp.com",
  projectId: "pcs-swap-tool",
  storageBucket: "pcs-swap-tool.firebasestorage.app",
  messagingSenderId: "786168505785",
  appId: "1:786168505785:web:09fe24b0917296ab6ec268"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let lastGeneratedUrl = '';

// ── AUTH ─────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    document.getElementById('admin-email-sub').textContent = `Signed in as ${user.email}`;
    loadTokens();
    loadDevices();
  } else {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('admin-panel').style.display = 'none';
  }
});

window.doLogin = async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    errEl.style.display = 'block';
    errEl.textContent = 'Invalid email or password.';
  }
};

window.doSignOut = async () => { await signOut(auth); };

// ── GENERATE TOKEN ───────────────────────────────────
window.generateToken = async () => {
  const name = document.getElementById('recipient-name').value.trim();
  if (!name) { alert('Enter a recipient name first.'); return; }
  const hours = parseInt(document.getElementById('token-expiry').value);
  const maxInstalls = parseInt(document.getElementById('token-max-installs').value);
  const expiresAt = new Date(Date.now() + hours * 3600000);

  const array = new Uint8Array(20);
  crypto.getRandomValues(array);
  const token = Array.from(array).map(b => b.toString(16).padStart(2,'0')).join('');

  try {
    await addDoc(collection(db, 'tokens'), {
      token,
      recipient: name,
      used: false,
      installCount: 0,
      maxInstalls,
      createdAt: serverTimestamp(),
      expiresAt: expiresAt.toISOString(),
      createdBy: currentUser.email
    });

    const base = window.location.origin + window.location.pathname.replace('admin.html','') + 'index.html';
    const url = `${base}?token=${token}`;
    lastGeneratedUrl = url;

    document.getElementById('gen-name-label').textContent = name;
    document.getElementById('generated-url').textContent = url;
    document.getElementById('generated-box').style.display = 'block';
    document.getElementById('recipient-name').value = '';
    document.getElementById('copy-gen-btn').textContent = '📋 Copy Link';
    loadTokens();
    loadDevices();
  } catch (e) {
    alert('Error: ' + e.message);
  }
};

window.copyGenerated = () => {
  navigator.clipboard.writeText(lastGeneratedUrl).then(() => {
    const btn = document.getElementById('copy-gen-btn');
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = '📋 Copy Link', 2000);
  });
};

// ── COPY TOKEN URL ───────────────────────────────────
window.copyTokenUrl = (token, btnId) => {
  const base = window.location.origin + window.location.pathname.replace('admin.html','') + 'index.html';
  const url = `${base}?token=${token}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById(btnId);
    if(btn){ btn.textContent = '✅'; setTimeout(() => btn.textContent = '📋', 2000); }
  });
};

// ── REVOKE TOKEN ─────────────────────────────────────
window.revokeToken = async (id) => {
  if (!confirm('Delete this token? This cannot be undone.')) return;
  try { await deleteDoc(doc(db, 'tokens', id)); loadTokens(); } 
  catch (e) { alert('Error: ' + e.message); }
};

// ── REVOKE DEVICE ────────────────────────────────────
window.revokeDevice = async (id) => {
  if (!confirm('Revoke this device\'s access? They will be locked out within 12 hours.')) return;
  try {
    await setDoc(doc(db, 'devices', id), { revoked: true }, { merge: true });
    loadDevices();
  } catch (e) { alert('Error: ' + e.message); }
};

// ── LOAD TOKENS ──────────────────────────────────────
window.loadTokens = async () => {
  const el = document.getElementById('token-list');
  el.innerHTML = '<p style="font-size:12px;color:#aaa">Loading...</p>';
  try {
    const q = query(collection(db, 'tokens'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    if (snap.empty) { el.innerHTML = '<p style="font-size:12px;color:#aaa">No tokens yet.</p>'; return; }
    const now = new Date();
    let active=0, used=0;
    let html = '';
    snap.forEach(docSnap => {
      const d = docSnap.data();
      const expired = d.expiresAt && new Date(d.expiresAt) < now;
      const fullyUsed = d.installCount >= d.maxInstalls;
      const status = d.used && fullyUsed ? 'used' : expired ? 'expired' : 'unused';
      if(status==='unused') active++;
      if(status==='used') used++;
      const badgeClass = status==='unused'?'badge-unused':status==='used'?'badge-used':'badge-expired';
      const expDate = d.expiresAt ? new Date(d.expiresAt).toLocaleDateString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
      const btnId = `copy-${docSnap.id}`;
      html += `<div class="token-row">
        <div class="token-info">
          <div class="token-name">${d.recipient||'Unknown'}</div>
          <div class="token-meta">Expires: ${expDate} · ${d.installCount||0}/${d.maxInstalls||1} installs</div>
        </div>
        <div class="token-actions">
          <span class="badge ${badgeClass}">${status}</span>
          ${status==='unused'?`<button class="icon-btn" id="${btnId}" onclick="copyTokenUrl('${d.token}','${btnId}')">📋</button>`:''}
          <button class="icon-btn danger" onclick="revokeToken('${docSnap.id}')">✕</button>
        </div>
      </div>`;
    });
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-used').textContent = used;
    el.innerHTML = html || '<p style="font-size:12px;color:#aaa">No tokens.</p>';
  } catch (e) {
    el.innerHTML = `<p style="font-size:12px;color:#d94040">Error: ${e.message}</p>`;
  }
};

// ── LOAD DEVICES ─────────────────────────────────────
window.loadDevices = async () => {
  const el = document.getElementById('device-list');
  el.innerHTML = '<p style="font-size:12px;color:#aaa">Loading...</p>';
  try {
    const snap = await getDocs(collection(db, 'devices'));
    document.getElementById('stat-devices').textContent = snap.size;
    if (snap.empty) { el.innerHTML = '<p style="font-size:12px;color:#aaa">No devices installed yet.</p>'; return; }
    let html = '';
    snap.forEach(docSnap => {
      const d = docSnap.data();
      const grantedDate = d.grantedAt ? new Date(d.grantedAt).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}) : '—';
      const revoked = d.revoked ? ' <span class="badge badge-used">revoked</span>' : '';
      html += `<div class="token-row">
        <div class="token-info">
          <div class="token-name">${d.recipient||'Unknown'}${revoked}</div>
          <div class="token-meta">Installed: ${grantedDate} · ID: ${docSnap.id.slice(0,12)}...</div>
        </div>
        <div class="token-actions">
          ${!d.revoked?`<button class="icon-btn danger" onclick="revokeDevice('${docSnap.id}')">Revoke</button>`:'<span style="font-size:11px;color:#aaa">Access removed</span>'}
        </div>
      </div>`;
    });
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<p style="font-size:12px;color:#d94040">Error: ${e.message}</p>`;
  }
};

// Allow Enter key on login
document.getElementById('login-password').addEventListener('keydown', e => {
  if(e.key === 'Enter') window.doLogin();
});
</script>
</body>
</html>
